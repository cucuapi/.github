# Workflow reutilizable (SSOT) que decide dónde corre el CI de la org: enciende la máquina cucu-devbox por OIDC y corre
# ahí; si AWS no responde, cae a ubuntu-latest. No usa secretos: en plan Free los de organización no llegan a repos privados.
#
# Uso en cualquier repo de cucuapi:
#   jobs:
#     pick-runner:
#       permissions:
#         id-token: write
#         contents: read
#       uses: cucuapi/.github/.github/workflows/pick-runner.yml@main
#     build:
#       needs: pick-runner
#       runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
name: pick-runner
on:
  workflow_call:
    inputs:
      label:
        description: Label del runner propio
        type: string
        default: devbox
      instance-id:
        description: Máquina que corre el runner
        type: string
        default: i-08e503c2468fbd637
      role-arn:
        description: Rol que sólo puede encender esa máquina
        type: string
        default: arn:aws:iam::017820690384:role/cucu-devbox-ci-wake
      region:
        type: string
        default: us-east-2
    outputs:
      runner:
        description: JSON para runs-on
        value: ${{ jobs.pick.outputs.runner }}

jobs:
  pick:
    name: pick-runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Credenciales por OIDC
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.region }}

      - name: Encender la máquina y elegir runner
        id: pick
        env:
          AWS_OK: ${{ steps.aws.outcome }}
          INSTANCE: ${{ inputs.instance-id }}
          LABEL: ${{ inputs.label }}
        run: |
          runner='"ubuntu-latest"'
          if [ "$AWS_OK" = success ] && aws ec2 start-instances --instance-ids "$INSTANCE" >/dev/null; then
            runner="[\"self-hosted\",\"$LABEL\"]"
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "runner elegido: $runner" >> "$GITHUB_STEP_SUMMARY"
